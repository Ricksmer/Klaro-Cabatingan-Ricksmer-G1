{% extends 'base.html' %}
{% block title %}Edit Profile | Klaro{% endblock %}
{% block nav_profile %}active{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">Account</p><h1>Edit profile</h1></div>
</div>
<div class="card compact">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn"><i data-lucide="save" aria-hidden="true"></i>Save changes</button>
      <a class="btn secondary" href="{% url 'accounts:profile' %}"><i data-lucide="x" aria-hidden="true"></i>Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
