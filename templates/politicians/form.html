{% extends 'base.html' %}
{% block title %}{{ title }} | Klaro{% endblock %}
{% block content %}
<div class="card" style="max-width:640px; margin-left:auto; margin-right:auto;">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <button type="submit" class="btn">Save</button>
    <a class="btn secondary" href="{% url 'politicians:manage' %}">Cancel</a>
  </form>
</div>
{% endblock %}
