{% extends 'base.html' %}
{% block title %}Delete Politician | Klaro{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete profile?</h1>
  <p>This permanently deletes <strong>{{ politician.full_name }}</strong> and their term of office. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:var(--red);">Yes, delete</button>
    <a class="btn secondary" href="{% url 'politicians:manage' %}">Cancel</a>
  </form>
</div>
{% endblock %}
